name: Publish to npm

# Publishes the package when a GitHub release is published, or by hand (Actions → Publish to npm →
# Run workflow) for an existing release tag, e.g. to retry a release whose publish failed.
# The version comes from the release tag (v1.2.3 or 1.2.3); package.json's version is ignored.
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret is needed, but the package's
# npmjs.com settings must list this repository and workflow file as a trusted publisher.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.5.0)
        required: true
        type: string
      dist-tag:
        description: npm dist-tag (empty = "next" for pre-release versions like v1.2.3-beta.1, otherwise "latest")
        required: false
        type: string

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          # Same Node as CI, so the checks below run where they're known to pass.
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: npm ci

      - name: Set package version from the release tag
        id: version
        run: |
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag $TAG is not a version like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          if npm view "@casmo/tree.js@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@casmo/tree.js@$VERSION is already on npm; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only the published package gets this version; package.json in the repo is not changed.
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # The checks prepublishOnly would run, as separate steps so a failure shows which one.
      # The release tag's code was already tested by CI on main; here the unit tests get a generous
      # timeout, because the catalogue-wide tests (every Species, several Seeds) can take longer than
      # vitest's 5 s default on a shared runner. Passed on the command line so retrying an older tag
      # (whose test files have no per-test timeouts) passes too.
      - name: Lint
        if: steps.version.outputs.published != 'true'
        run: npm run lint
      - name: Typecheck
        if: steps.version.outputs.published != 'true'
        run: npm run typecheck
      - name: Unit tests
        if: steps.version.outputs.published != 'true'
        run: npm test -- --testTimeout=120000 --hookTimeout=120000
      - name: Build
        if: steps.version.outputs.published != 'true'
        run: npm run build

      # --ignore-scripts: prepublishOnly would run all the checks above again (with the short timeout).
      # GitHub pre-releases (and tags like v1.2.3-beta.1) go to the "next" dist-tag so they don't become "latest".
      - name: Publish
        if: steps.version.outputs.published != 'true'
        env:
          DIST_TAG: ${{ inputs.dist-tag || ((github.event.release.prerelease || contains(env.TAG, '-')) && 'next' || 'latest') }}
        run: npm publish --provenance --ignore-scripts --tag "$DIST_TAG"
