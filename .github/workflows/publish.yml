name: Publish to npm

# Publishes the package when a GitHub release is published.
# The release tag must match package.json's version (v1.2.3 or 1.2.3).
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret is needed, but the package's
# npmjs.com settings must list this repository and workflow file as a trusted publisher.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Check release tag matches package.json version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@casmo/tree.js@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@casmo/tree.js@$VERSION is already on npm; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly runs lint, typecheck, unit tests and the build.
      # GitHub pre-releases go to the "next" dist-tag so they don't become "latest".
      - name: Publish
        if: steps.version.outputs.published != 'true'
        run: npm publish --provenance --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
