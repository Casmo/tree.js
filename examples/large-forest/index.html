<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tree.js - large forest example</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3f0; }
      canvas { display: block; }
      #panel { position: fixed; left: 8px; top: 8px; font: 12px sans-serif; color: #234; background: rgba(255, 255, 255, 0.82); border-radius: 4px; padding: 6px 8px; }
      #panel table { border-collapse: collapse; }
      #panel th, #panel td { padding: 1px 6px; text-align: right; font-variant-numeric: tabular-nums; }
      #panel th:first-child, #panel td:first-child { text-align: left; }
      #panel .current { font-weight: bold; }
      #panel button { margin-top: 4px; font: inherit; }
      #status { position: fixed; left: 8px; bottom: 8px; font: 12px sans-serif; color: #234; }
    </style>
  </head>
  <body>
    <div id="panel">
      <table>
        <thead><tr><th></th><th id="head-off">Detail Levels off</th><th id="head-on">Detail Levels on</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <button id="toggle" type="button" disabled>Switch Detail Levels</button>
    </div>
    <div id="status"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
